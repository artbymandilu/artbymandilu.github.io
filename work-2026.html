<!DOCTYPE html>

<head>

  <title>My Work – Studio Projects</title>

<link rel="icon" type="image/png" href="images/favicon.png">
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Center the message both vertically and horizontally */
    body, html {
      height: 100%;
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: #f8f8f8;
      color: #333;
    }
    .center-message {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 80vh;
      font-size: 2rem;
      font-weight: bold;
      color: #e6db7a; /* dark yellow */
      text-align: center;
      padding: 1rem;
    }

    /* NAVIGATION BAR */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: #f0f0f0;
      position: relative;
      z-index: 10;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .nav-links {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .dropdown {
      position: relative;
    }

    .dropdown-content {
      position: absolute;
      top: 100%;
      left: 0;
      background-color: #f0f0f0;
      border-radius: 10px;
      overflow: hidden;
      opacity: 0;
      max-height: 0;
      transition: opacity 0.4s ease, max-height 0.4s ease;
      display: flex;
      flex-direction: column;
      pointer-events: none;
    }

    .dropdown:hover .dropdown-content {
      opacity: 1;
      max-height: 200px;
      pointer-events: auto;
    }

    .dropdown-content a {
  padding: 1rem 1.5rem;
  background-color: #fff099;
  color: #333;
  text-decoration: none;
  font-weight: bold;
  transition: background-color 0.3s ease;
}

.dropdown-content a:hover {
  background-color: #ffe956;
}

  </style>
</head>
<body>
